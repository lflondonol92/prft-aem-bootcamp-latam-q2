<sly
  data-sly-use.subscribe="com.aembootcamp.core.models.SubscribeModel"
/>
<sly
  data-sly-use.clientlib="core/wcm/components/commons/v1/templates/clientlib.html"
>
  <sly data-sly-call="${clientlib.all @ categories='aem-bootcamp.subscribe'}" />
</sly>

<div class="cmp-subscribe">
  <form method="post" action="" id="subscribe-form" data-redirect="${subscribe.redirect @ extension='html'}" >
    <div class="cmp-subscribe__input-group">
      <label for="first-name">${subscribe.firstNameLabel}:</label>
      <input id="first-name" type="text" name="First Name" required />
    </div>
    <div class="cmp-subscribe__input-group">
      <label for="last-name">${subscribe.lastNameLabel}:</label>
      <input id="last-name" type="text" name="Last Name" required />
    </div>
    <div class="cmp-subscribe__input-group">
      <label for="email-id">${subscribe.emailLabel}:</label>
      <input id="email-id" type="email" name="Email Id" required />
    </div>
    <div class="cmp-subscribe__input-group">
      <label for="article-type">${subscribe.preferredArticleTypeLabel}: </label>
      <select
        data-sly-list="${subscribe.articleTypes}"
        name="article-type"
        id="article-type"
        required
      >
        <option value="${item}">${item}</option>
      </select>
    </div>
    <button type="submit">Subscribe</button>
  </form>
</div>
